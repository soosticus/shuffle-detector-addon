[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shuffledetector"
version = "0.1.0"
description = "Find the most profitable Tailoring -> Enchanting shuffle from WoW auction house scans."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
shuffledetector = "shuffledetector.cli:main"

[project.gui-scripts]
shuffledetector-gui = "shuffledetector.gui.app:main"

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shuffledetector = ["_addon/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
