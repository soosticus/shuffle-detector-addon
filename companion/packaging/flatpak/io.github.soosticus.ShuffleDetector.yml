# Wraps the PyInstaller build (dist/ShuffleDetector-Companion, made by release.yml) in a Flatpak.
# The KDE runtime supplies the system libraries Qt needs (xcb, EGL, xkbcommon, fonts).
app-id: io.github.soosticus.ShuffleDetector
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: ShuffleDetector-Companion
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # The companion reads and writes the WoW folder (SavedVariables, AddOns), which can live anywhere in a
  # Wine prefix. Other locations: flatpak override --user --filesystem=/path io.github.soosticus.ShuffleDetector
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
modules:
  - name: companion
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib /app/bin /app/share/applications
      - cp -r ShuffleDetector-Companion /app/lib/shuffledetector
      - install -Dm755 launcher.sh /app/bin/ShuffleDetector-Companion
      - install -Dm644 io.github.soosticus.ShuffleDetector.desktop /app/share/applications/io.github.soosticus.ShuffleDetector.desktop
    sources:
      - type: dir
        path: ../../../dist/ShuffleDetector-Companion
        dest: ShuffleDetector-Companion
      - type: file
        path: launcher.sh
      - type: file
        path: io.github.soosticus.ShuffleDetector.desktop
