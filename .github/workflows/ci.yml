name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      # WoW uses Lua 5.1: luac5.1 catches 5.3+ syntax such as the // operator.
      - run: tests/run.sh
