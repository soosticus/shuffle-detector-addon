name: Release

# Push a tag like v0.3.0 to build the addon zip and the companion app for each OS and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip addon
        run: |
          VERSION=$(grep -m1 '^## Version:' addon/ShuffleDetector/ShuffleDetector.toc | sed 's/.*: *//' | tr -d '\r')
          echo "Addon version: $VERSION"
          mkdir -p dist
          cp LICENSE addon/ShuffleDetector/LICENSE
          (cd addon && zip -r "../dist/ShuffleDetector-$VERSION.zip" ShuffleDetector)
      - uses: actions/upload-artifact@v4
        with:
          name: addon
          path: dist/*.zip

  app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            sep: ";"
          - os: ubuntu-latest
            platform: linux
            sep: ":"
          - os: macos-latest
            platform: macos
            sep: ":"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^__version__ = .*/__version__ = \"$VERSION\"/" companion/src/shuffledetector/__init__.py
          rm companion/src/shuffledetector/__init__.py.bak
      - name: Install
        run: python -m pip install -e "companion[gui,dev]" pyinstaller
      - name: Run tests
        run: python -m pytest companion/tests
      - name: Build
        shell: bash
        run: |
          pyinstaller companion/packaging/gui_entry.py --name ShuffleDetector-Companion --windowed --noconfirm \
            --paths companion/src \
            --add-data "addon/ShuffleDetector${{ matrix.sep }}shuffledetector/_addon/ShuffleDetector" \
            --add-data "common/data${{ matrix.sep }}shuffledetector/_data"
      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          cd dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a "ShuffleDetector-Companion-${TAG}-windows.zip" ShuffleDetector-Companion
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            zip -r "ShuffleDetector-Companion-${TAG}-macos.zip" ShuffleDetector-Companion.app
          else
            tar czf "ShuffleDetector-Companion-${TAG}-linux.tar.gz" ShuffleDetector-Companion
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: [addon, app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
