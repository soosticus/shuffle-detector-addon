name: Release

# Push a tag like v0.3.0 to test the addon, build its zip and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: tests/run.sh
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp addon version
        run: |
          sed -i "s/@project-version@/${{ steps.version.outputs.value }}/" addon/ShuffleDetector/ShuffleDetector.toc
          grep -qE '^## Version: ${{ steps.version.outputs.value }}[[:space:]]*$' addon/ShuffleDetector/ShuffleDetector.toc
      - name: Zip addon
        run: |
          VERSION=$(grep -m1 '^## Version:' addon/ShuffleDetector/ShuffleDetector.toc | sed 's/.*: *//' | tr -d '\r')
          echo "Addon version: $VERSION"
          mkdir -p dist
          cp LICENSE addon/ShuffleDetector/LICENSE
          (cd addon && zip -r "../dist/ShuffleDetector-$VERSION.zip" ShuffleDetector)
      - uses: actions/upload-artifact@v4
        with:
          name: addon
          path: dist/*.zip

  release:
    needs: [addon]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Pick release notes
        id: notes
        run: |
          # Hand-written notes live in release-notes/<tag>.md; fall back to generated notes if missing.
          if [[ -f "release-notes/${GITHUB_REF_NAME}.md" ]]; then
            echo "path=release-notes/${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
